services:
  mysql:
    image: mysql:8
    container_name: lifeos_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lifeos
      MYSQL_USER: lifeos_user
      MYSQL_PASSWORD: lifeos_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: lifeos_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
